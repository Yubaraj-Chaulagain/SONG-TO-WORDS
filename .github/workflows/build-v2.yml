name: SONG TO WORDS V2 BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Install Android Packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-35"
          sdkmanager --install "build-tools;35.0.0"
          sdkmanager --install "ndk;27.0.12077973"
          sdkmanager --install "cmake;3.22.1"

      - name: Download Whisper
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/ggml-org/whisper.cpp.git whisper.cpp

      - name: Download AI Model
        run: |
          mkdir -p whisper.cpp/examples/whisper.android/app/src/main/assets/models
          curl -L --fail --retry 3 \
          https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin \
          -o whisper.cpp/examples/whisper.android/app/src/main/assets/models/ggml-base.bin

      - name: Build APK
        working-directory: whisper.cpp/examples/whisper.android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SONG-TO-WORDS-V2-APK
          path: whisper.cpp/examples/whisper.android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
