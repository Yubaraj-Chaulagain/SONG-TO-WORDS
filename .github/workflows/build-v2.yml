name: SONG TO WORDS - TINY AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # Step 1: Clone Whisper
      - name: Clone Whisper
        run: |
          git clone --depth 1 --recurse-submodules \
          https://github.com/ggml-org/whisper.cpp.git whisper

      # Step 2: Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Step 3: Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 9.0

      # Step 4: Download Tiny AI Model
      - name: Download Tiny AI Model
        run: |
          mkdir -p whisper/examples/whisper.android/app/src/main/assets/models

          curl -fL --retry 3 \
          https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin \
          -o whisper/examples/whisper.android/app/src/main/assets/models/ggml-tiny.bin

          ls -lh whisper/examples/whisper.android/app/src/main/assets/models/

      # Step 5: Add Sample Audio
      - name: Add Sample Audio
        run: |
          mkdir -p whisper/examples/whisper.android/app/src/main/assets/samples

          cp whisper/samples/jfk.wav \
          whisper/examples/whisper.android/app/src/main/assets/samples/

      # Step 6: Build APK
      - name: Build APK
        run: |
          cd whisper/examples/whisper.android

          chmod +x gradlew

          ./gradlew assembleRelease --no-daemon --stacktrace

      # Step 7: Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SONG-TO-WORDS-TINY-APK
          path: whisper/examples/whisper.android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
